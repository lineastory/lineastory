<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기질 프로파일 · 리네아스토리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380;0,9..144,500;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --coral:#D9776A; --coral-fill:#F7E4E0;
    --blue:#4F86B5;  --blue-fill:#E0EAF3;
    --green:#5FA05F; --green-fill:#E2F0E2;
    --purple:#8E72B8;--purple-fill:#ECE5F4;
    --ink:#2B2A28; --mute:#7c766e; --faint:#a9a39a;
    --paper:#F4F0E9; --card:#fff; --line:#ece7df; --line2:#f3efe8; --warm:#FAF6EF;
    --accent:var(--coral); --accent-fill:var(--coral-fill);
    --serif:"Fraunces","Pretendard",serif;
    --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);color:var(--ink);
    background:radial-gradient(120% 70% at 85% -8%,#fbf4ea,transparent 55%),var(--paper);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 56px;-webkit-font-smoothing:antialiased;}
  .app{width:430px;max-width:100%;background:var(--card);border:1px solid #f0ebe2;
    border-radius:30px;box-shadow:0 30px 70px -30px rgba(70,55,30,.35);overflow:hidden;}
  .pad{padding:32px 26px 28px;}
  .reveal{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .hide{display:none!important;}
  .up{color:var(--coral);} .dn{color:var(--blue);} .midc{color:var(--faint);}

  /* INTRO */
  .dots{display:flex;gap:5px;margin-bottom:20px;}
  .dots i{width:6px;height:6px;border-radius:50%;}
  .kicker{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--coral);letter-spacing:.05em;margin-bottom:10px;}
  h1{font-size:32px;line-height:1.3;font-weight:700;letter-spacing:-.02em;margin-bottom:13px;}
  h1 em{font-family:var(--serif);font-style:italic;font-weight:380;color:var(--coral);}
  .lead{font-size:14.5px;line-height:1.7;color:var(--mute);margin-bottom:24px;}
  .specs{display:flex;flex-direction:column;gap:1px;background:var(--line2);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:24px;}
  .specs .r{display:flex;justify-content:space-between;background:#fff;padding:13px 16px;font-size:13.5px;}
  .specs .r .v{font-family:var(--serif);color:var(--ink);}
  .btn{display:block;width:100%;text-align:center;border:0;border-radius:14px;padding:17px;font-family:var(--sans);font-size:15.5px;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .2s;}
  .btn.solid{background:var(--ink);color:#fff;box-shadow:0 12px 26px -12px rgba(40,35,25,.55);}
  .btn.accent{background:var(--coral);color:#fff;}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
  .btn:hover{transform:translateY(-1px);}
  .mini{display:block;width:100%;text-align:center;background:none;border:0;color:var(--faint);font-size:12.5px;margin-top:14px;cursor:pointer;text-decoration:underline;}
  .anchor{display:flex;align-items:center;gap:9px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);}
  .anchor .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--coral-fill),var(--purple-fill));display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;}
  .anchor .nm{font-size:13px;font-weight:600;} .anchor .nm small{display:block;font-weight:500;color:var(--faint);font-size:11.5px;}
  .foot{font-size:11.5px;color:var(--faint);line-height:1.6;margin-top:14px;}

  /* QUIZ */
  .qtop{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mute);margin-bottom:12px;}
  .qtop b{color:var(--coral);font-family:var(--serif);}
  .bar{height:5px;background:#ece7df;border-radius:99px;overflow:hidden;margin-bottom:34px;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--purple));transition:width .35s;}
  .qtext{font-size:22px;line-height:1.5;font-weight:600;letter-spacing:-.01em;min-height:96px;}
  .qhelp{font-size:12.5px;color:var(--faint);margin-bottom:26px;}
  .scale{display:flex;flex-direction:column;gap:9px;}
  .opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:14px 16px;font-family:var(--sans);font-size:15px;color:var(--ink);cursor:pointer;transition:.16s;}
  .opt:hover{border-color:var(--coral);background:var(--coral-fill);}
  .opt .ring{width:20px;height:20px;border-radius:50%;border:2px solid #d8d2c8;flex:0 0 auto;transition:.16s;}
  .opt:hover .ring{border-color:var(--coral);box-shadow:inset 0 0 0 4px var(--coral);}
  .qback{background:none;border:0;color:var(--faint);font-size:13px;margin-top:22px;cursor:pointer;}

  /* RESULT */
  .rtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .rtop .k{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--coral);}
  .rtop .restart{background:none;border:0;color:var(--faint);font-size:12px;cursor:pointer;}
  .rh{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:3px;}
  .rsub{font-size:12.5px;color:var(--mute);margin-bottom:18px;}
  .steps{display:flex;gap:4px;background:#f6f2ec;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:22px;}
  .steps button{flex:1;border:0;background:transparent;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--mute);padding:9px 4px;border-radius:9px;cursor:pointer;}
  .steps button.on{background:#fff;color:var(--ink);box-shadow:0 3px 8px rgba(60,50,30,.08);}
  .panel{display:none;} .panel.on{display:block;animation:rise .4s ease both;}

  /* ranking */
  .rank{display:flex;flex-direction:column;gap:7px;}
  .rrow{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:13px;}
  .rrow .pip{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
  .rrow .no{font-family:var(--serif);font-size:14px;color:var(--faint);width:13px;}
  .rrow .nm{flex:1;font-size:14.5px;font-weight:600;}
  .rrow .nm small{font-weight:500;color:var(--faint);font-size:11px;margin-left:5px;}
  .rrow .ar{font-size:12px;font-weight:700;font-family:var(--serif);}
  .rrow .val{font-family:var(--serif);font-size:15px;width:24px;text-align:right;}
  .note{font-size:12px;color:var(--mute);line-height:1.6;margin-top:14px;background:var(--warm);border:1px solid #efe7d8;border-radius:11px;padding:12px 14px;}

  /* combo */
  .combo{border:1px solid var(--accent);border-radius:16px;padding:19px 17px;background:linear-gradient(180deg,var(--accent-fill),#fff 62%);}
  .combo .pair{font-size:11.5px;font-weight:700;color:var(--accent);margin-bottom:6px;}
  .combo h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:11px;}
  .combo p.b{font-size:14px;line-height:1.72;}
  .kv{margin-top:13px;font-size:13px;line-height:1.6;}
  .kv .l{font-weight:700;color:var(--accent);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .chip{font-size:11.5px;font-weight:600;color:var(--accent);background:#fff;border:1px solid var(--accent-fill);padding:5px 10px;border-radius:99px;}
  .qbox{background:var(--warm);border:1px solid #efe7d8;border-radius:12px;padding:13px 14px;margin-top:13px;}
  .qbox .qq{font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.5;}
  .third{font-size:12px;color:var(--mute);line-height:1.6;margin-top:12px;padding-top:12px;border-top:1px dashed #e2dccf;}
  .third b{color:var(--ink);}

  /* dim sub-tabs */
  .dimhint{font-size:11.5px;color:var(--faint);margin-bottom:9px;}
  .dimtabs{display:flex;gap:4px;background:#f1ece4;border:1px solid var(--line);border-radius:13px;padding:4px;margin-bottom:16px;}
  .dimtabs button{flex:1 1 0;min-width:0;border:0;background:transparent;font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:-.03em;padding:10px 2px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:background .16s,box-shadow .16s;}
  .dimtabs button:hover{background:#fff;}
  .dimtabs button.on{box-shadow:0 3px 8px rgba(60,50,30,.2);}
  .dimtabs button.on:hover{background:inherit;}
  .dimcard .dh{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
  .dimcard .dh .t{font-size:20px;font-weight:700;letter-spacing:-.02em;}
  .dimcard .dh .lv{font-size:13px;font-weight:600;}
  .dimcard .en{font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--faint);margin-bottom:12px;}
  .dimcard .core{font-size:14px;line-height:1.7;margin-bottom:6px;}
  .dimcard .common{font-size:13px;line-height:1.72;color:var(--mute);background:var(--warm);border:1px solid #efe7d8;border-radius:11px;padding:13px 14px;margin:8px 0 4px;}
  .dimcard .myhead{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:18px 0 9px;padding-top:15px;border-top:1px solid var(--line);}
  .ln{padding:9px 0;border-top:1px solid var(--line2);}
  .ln .t{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:3px;word-break:keep-all;}
  .ln .x{font-size:12.5px;line-height:1.6;color:var(--mute);}
  .row2{font-size:12.5px;line-height:1.6;margin-top:9px;}
  .row2 b{font-weight:700;}
  .rf{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--mute);margin-top:11px;}

  /* apply */
  .apply{border:1px dashed #d8d2c8;border-radius:14px;padding:15px;}
  .apply p{font-size:13px;color:var(--mute);margin-bottom:9px;}
  .apply textarea{width:100%;border:0;background:transparent;resize:none;font-family:var(--sans);font-size:14px;line-height:1.7;min-height:70px;outline:none;color:var(--ink);}
  .apply textarea::placeholder{color:#cfc8bd;}
  .btns{display:flex;gap:10px;margin-top:20px;}
  .btns .btn{flex:1;padding:14px;font-size:14px;}
  .disc{font-size:11px;color:var(--faint);text-align:center;line-height:1.6;margin-top:14px;}

  /* report (image/PDF) */
  #report{position:absolute;left:-99999px;top:0;width:700px;background:#fff;color:#2B2A28;font-family:var(--sans);padding:34px 36px;}
  #report .r-head{border-bottom:2px solid #D9776A;padding-bottom:12px;margin-bottom:8px;}
  #report .r-kicker{font-size:10px;font-weight:700;letter-spacing:.18em;color:#D9776A;margin-bottom:6px;}
  #report .r-title{font-size:25px;font-weight:700;letter-spacing:-.02em;}
  #report .r-sec{font-size:12px;font-weight:700;color:#D9776A;letter-spacing:.04em;margin:22px 0 10px;}
  #report .r-rank{display:flex;flex-direction:column;gap:6px;}
  #report .r-row{display:flex;align-items:center;gap:10px;border:1px solid #ece7df;border-radius:10px;padding:10px 12px;}
  #report .r-no{font-family:var(--serif);color:#a9a39a;width:12px;}
  #report .r-pip{width:9px;height:9px;border-radius:50%;}
  #report .r-nm{flex:1;font-weight:600;font-size:14px;} #report .r-nm small{color:#a9a39a;font-weight:500;font-size:11px;margin-left:4px;}
  #report .r-ar{font-family:var(--serif);font-weight:700;}
  #report .r-val{font-family:var(--serif);width:24px;text-align:right;}
  #report .r-dim{border:1px solid #ece7df;border-radius:10px;padding:13px 14px;margin-bottom:8px;page-break-inside:avoid;}
  #report .r-dh{margin-bottom:6px;font-size:15px;}
  #report .r-dh .r-pip{display:inline-block;margin-right:7px;vertical-align:middle;}
  #report .r-core{font-size:13px;line-height:1.65;margin-bottom:6px;}
  #report .r-st{font-size:12.5px;color:#7c766e;}
  #report .combo{page-break-inside:avoid;}
  #report .rep-block{margin-bottom:12px;break-inside:avoid;page-break-inside:avoid;}
  #report .dimcard{border:1px solid #ece7df;border-radius:12px;padding:15px 16px;}
  #report .r-foot{margin-top:20px;border-top:1px solid #ece7df;padding-top:12px;}
  #report .r-foot-name{font-size:11px;font-weight:700;letter-spacing:.12em;color:#D9776A;margin-bottom:5px;}
  #report .r-foot-note{font-size:10.5px;color:#a9a39a;line-height:1.6;}
  @media print{
    body{padding:0;background:#fff;display:block;}
    .app{display:none!important;}
    #report{position:static!important;left:auto!important;width:auto!important;padding:0;}
    #report .rep-block,#report .dimcard,#report .combo,#report .rrow{break-inside:avoid;page-break-inside:avoid;}
    #report .r-sec{break-after:avoid;page-break-after:avoid;}
    #report .r-head,#report .r-foot{break-inside:avoid;}
    @page{size:A4;margin:14mm;}
  }
  #measure{position:absolute;left:-99999px;top:0;width:698px;background:#fff;color:#2B2A28;font-family:var(--sans);}
  #measure .u,.page .u{margin-bottom:8px;}
  #measure .usec,.page .usec{font-size:12px;font-weight:700;color:#D9776A;letter-spacing:.02em;margin:4px 0 8px;}
  #pages{position:absolute;left:-99999px;top:0;}
  .page{width:794px;height:1123px;background:#fff;box-sizing:border-box;padding:40px 48px 28px;display:flex;flex-direction:column;color:#2B2A28;font-family:var(--sans);}
  .page-h{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #D9776A;padding-bottom:8px;margin-bottom:14px;}
  .page-h .ph-l{font-size:16px;font-weight:700;color:#D9776A;letter-spacing:-.01em;}
  .page-h .ph-r{font-size:10.5px;color:#8a8178;letter-spacing:.16em;}
  .page-c{flex:1;overflow:hidden;}
  .page-f{display:flex;justify-content:space-between;border-top:1px solid #ece7df;padding-top:8px;margin-top:12px;font-size:10px;color:#a9a39a;letter-spacing:.02em;}
  #ovl{position:fixed;inset:0;background:rgba(40,35,28,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;z-index:9999;font-family:var(--sans);}
  #imgmodal{position:fixed;inset:0;background:rgba(40,35,28,.6);z-index:10000;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 12px;font-family:var(--sans);}
  #imgmodal .im-wrap{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:18px 16px 24px;box-shadow:0 12px 40px rgba(0,0,0,.25);}
  #imgmodal .im-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  #imgmodal .im-title{font-size:17px;font-weight:700;color:#2B2A28;}
  #imgmodal .im-close{border:0;background:#F0EBE6;color:#2B2A28;font-size:14px;font-weight:600;padding:8px 16px;border-radius:10px;cursor:pointer;font-family:var(--sans);}
  #imgmodal .im-tip{background:#FBF6F2;border:1px solid #F0E2DA;border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.6;color:#6B635B;margin-bottom:16px;}
  #imgmodal .im-card{margin-bottom:22px;}
  #imgmodal .im-no{font-size:13px;font-weight:600;color:#9A9088;margin-bottom:7px;}
  #imgmodal .im-img{width:100%;height:auto;border:1px solid #ECE6E0;border-radius:8px;display:block;}
  #imgmodal .im-dl{margin-top:9px;width:100%;border:0;background:#D9776A;color:#fff;font-size:15px;font-weight:600;padding:12px;border-radius:11px;cursor:pointer;font-family:var(--sans);}
</style>
</head>
<body>
<div class="app"><div class="pad" id="root"></div></div>
<div id="report"></div>
<div id="measure"></div>
<div id="pages"></div>

<script>
/* ===================== DATA ===================== */
const DIM = {
  NS:{name:"자극추구",eng:"Novelty Seeking",color:"#D9776A",fill:"#F7E4E0"},
  HA:{name:"위험회피",eng:"Harm Avoidance",color:"#4F86B5",fill:"#E0EAF3"},
  RD:{name:"사회적 민감성",eng:"Reward Dependence",color:"#5FA05F",fill:"#E2F0E2"},
  P :{name:"인내력",eng:"Persistence",color:"#8E72B8",fill:"#ECE5F4"},
};
const ORDER=["NS","HA","RD","P"];

const ITEMS={
 NS:["새로운 활동이나 경험이 생기면 가슴이 설레고 해보고 싶어진다.","가본 적 없는 장소나 처음 접하는 분야에 자연스럽게 끌린다.","익숙한 것을 반복하기보다 낯선 것을 탐색할 때 더 흥미를 느낀다.","마음이 끌리면 오래 따지지 않고 바로 행동으로 옮기는 편이다.","결정을 내릴 때 신중히 검토하기보다 직감에 의존하는 경향이 있다.","떠오른 생각을 곧장 실행하고 싶어 참기 어려울 때가 있다.","갖고 싶은 것이 생기면 형편을 따지기 전에 갖고 싶어진다.","계획보다 그때그때의 기분에 따라 돈이나 시간을 쓰는 편이다.","절약해 모으기보다 지금의 즐거움에 쓰는 쪽을 택한다.","정해진 규칙이나 틀에 맞추기보다 내 방식대로 하는 것이 편하다.","짜인 일정대로 움직이기보다 그때그때 자유롭게 정하고 싶다.","세세한 규정을 지키는 일에는 답답함을 느끼는 편이다."],
 HA:["어떤 일을 앞두면 잘못될 가능성부터 떠올리며 걱정한다.","앞날에 대해 낙관하기보다 안 좋은 결과를 먼저 상상하는 편이다.","일이 순조로워도 마음 한편에 불안이 남아 있을 때가 많다.","결과를 예측하기 어려운 상황에서는 쉽게 긴장된다.","익숙하지 않은 일을 시작할 때 두려움이 앞선다.","확실하지 않으면 차라리 시도하지 않고 그대로 두는 편이다.","처음 보는 사람들 앞에서는 위축되고 말수가 줄어든다.","낯선 자리에서는 편안해지기까지 시간이 오래 걸린다.","모르는 사람과 대화를 먼저 시작하는 것이 부담스럽다.","조금만 무리해도 쉽게 지치고 회복이 더디다.","평소에 기운이 부족하다고 느끼는 때가 많다.","스트레스를 받으면 몸과 마음의 에너지가 빨리 소진된다."],
 RD:["다른 사람의 슬픔이나 고통을 보면 마음이 쉽게 움직인다.","감동적인 이야기나 장면에 깊이 동요되는 편이다.","주변 사람의 감정 변화를 비교적 예민하게 느낀다.","내 감정이나 경험을 가까운 사람과 나누는 것이 자연스럽다.","속마음을 혼자 간직하기보다 표현하는 편이다.","다른 사람에게 내 기분을 솔직히 이야기하는 편이다.","가까운 사람과 정서적으로 깊이 연결될 때 안정감을 느낀다.","사람들과 비교적 빠르게 가까워지고 친밀한 관계를 맺는다.","마음을 나눌 사람이 곁에 있을 때 든든함을 느낀다.","중요한 결정을 내릴 때 주변 사람의 의견을 듣고 싶어진다.","타인의 인정이나 칭찬이 나에게 큰 힘이 된다.","어려운 일이 생기면 혼자 떠안기보다 누군가에게 의지하고 싶다."],
 P:["해야 할 일은 미루지 않고 부지런히 시작하는 편이다.","다소 귀찮은 일이라도 성실하게 해내려 한다.","일을 대충 넘기기보다 정성을 들이는 편이다.","어려움에 부딪혀도 쉽게 포기하지 않고 계속 시도한다.","남들이 그만둘 만한 상황에서도 끝까지 밀고 나가는 편이다.","장애물이 있어도 목표를 향해 꾸준히 나아간다.","기대 이상으로 잘 해내고 싶은 마음이 크다.","어려운 과제일수록 도전하고 싶은 의욕이 생긴다.","내가 하는 일에서 남들보다 뛰어나고 싶다.","일을 마칠 때까지 세부적인 부분도 완성도 있게 하려 한다.","만족스러운 결과가 나올 때까지 나 자신을 몰아붙이는 편이다.","어떤 일이든 최선의 결과를 얻기 전에는 끝내기 어렵다."],

const INTERP={"NS":{"core":"자극추구는 새로움과 잠재적 보상 앞에서 마음과 몸이 얼마나 빨리 활성화되는가를 보여주는 접근 동기 체계입니다. 단순히 “새로운 걸 좋아한다”는 취향의 문제가 아니라 무언가를 시작하기 전의 기대와 설렘이 그 사람을 움직이는 연료가 되느냐, 아니면 익숙함과 예측 가능성이 안정의 기반이 되느냐의 차이입니다.","reflect":"“새로움이 나를 설레게 하는 쪽인가요, 참기 어렵게 하는 쪽인가요?”","high":{"lens":[["업무 스타일","새 프로젝트의 출발선, 기획과 아이디어 발산, 변화가 잦고 즉흥성이 허용되는 환경에서 가장 활기차게 일합니다. 반대로 반복 업무·장기 관리·세부 마무리 단계에서는 동력이 급격히 식어 “시작은 잘하는데 끝맺음이 약하다”는 평을 듣기 쉽습니다."],["협업·소통","팀 분위기를 띄우고 새 시도를 먼저 제안하는 역할을 자주 맡습니다. 다만 결정 속도가 빠르고 화제 전환이 잦아 신중한 동료에게는 즉흥적·산만하게 비칠 수 있습니다."],["리더십 스타일","비전·변화 주도형. 새 방향을 빠르게 제시하고 팀에 에너지를 불어넣지만, 실행을 끝까지 끌고 가고 디테일을 점검해 줄 안정형 파트너가 곁에 있을 때 시너지가 큽니다."],["스트레스·소진 신호","권태와 반복이 길어질 때 무기력, 딴짓, 잦은 계획 변경, 충동적 결정으로 새어 나옵니다. 위기보다 변화 없는 지루함이 더 큰 소진 요인입니다."],["성장 연습","시작한 일을 끝까지 데려갈 외부 장치(마감일·함께할 사람·작은 보상) 미리 깔아두기, 행동 전 한 박자 멈춰 결과 그려보기, 우선순위를 좁혀 하나씩 마무리하기."]],"strength":"추진력 · 적응력 · 창의성 · 도전 정신","env":"다양한 활동과 변화의 기회가 있고, 움직이며 배울 수 있으며, 규칙은 짧고 명확한 환경. 에너지를 건강하게 쓸 통로가 있을 때 가장 활기찹니다.","misread":"산만하다 · 충동적이다 · 참을성이 없다 · 쉽게 싫증낸다"},"low":{"lens":[["업무 스타일","충분히 살피고 판단한 뒤 움직이며, 한번 자리 잡은 방식을 신뢰성 있게 유지합니다. 익숙한 환경에서 집중력이 높아지고, 깊이·꾸준함·정확성이 필요한 일에서 빛납니다. 반면 갑작스러운 변경이나 즉흥 대응에서는 시동이 더디고 부담을 느낍니다."],["협업·소통","차분하고 일관된 태도로 신뢰감을 줍니다. 변화 제안에 곧바로 반응하지 않아 ‘소극적’이거나 ‘느리다’는 오해를 받기도 하지만, 실은 충분히 검토한 뒤 안정적으로 움직이려는 성향일 뿐입니다."],["리더십 스타일","안정·관리형. 예측 가능한 운영, 위험 관리, 꾸준한 실행에서 신뢰를 얻습니다. 변화가 필요할 땐 미리 예고하고 준비할 시간을 준 뒤 단계적으로 도입할 때 팀이 잘 따라옵니다."],["스트레스·소진 신호","예고 없는 잦은 변화, 즉흥적 요구, 익숙해질 틈 없는 전환이 누적되면 긴장·회피·소진으로 이어집니다."],["성장 연습","새 시도를 한 번에 받아들이기보다 작은 단계로 쪼개 경험하기, 선택의 폭을 조금씩 넓혀보기, 변화 속에서도 해냈다는 경험을 쌓아 자신감 키우기."]],"strength":"꾸준함 · 책임감 · 안정성 · 정확성","env":"변화가 미리 예고되고, 준비할 시간이 충분하며, 익숙해질 기회가 반복되는 환경. 차분하게 시작하도록 도와줄 때 안정적으로 해냅니다.","misread":"답답하다 · 소극적이다 · 느리다 · 의욕이 없다"},"mid":{"intro":"새로움과 안정 어느 한쪽에 고정되지 않고, 상황에 따라 모드를 바꿀 수 있는 유형입니다. 부족해서 가운데가 아니라 양쪽을 다 쓸 수 있어서 가운데입니다.","lens":[["업무 스타일","새 일이 필요할 땐 호기심을 내고, 안정이 필요할 땐 차분히 유지하는 식으로 상황에 맞춰 움직입니다. 출발과 마무리 사이의 균형을 비교적 잘 잡지만, 스스로 방향을 정해야 하는 상황에서는 결정이 늦어질 수 있습니다."],["협업·소통","새로움을 즐기는 사람과 안정을 중시하는 사람 사이에서 다리 역할을 하기 쉽습니다. 양쪽 입장을 모두 이해해 조율에 강하지만, 분명한 색깔을 기대하는 상대에게는 “어느 쪽인지 모르겠다”는 인상을 줄 수도 있습니다."],["리더십 스타일","상황 판단형. 팀에 변화가 필요한지 안정이 필요한지 읽고 거기 맞춰 방향을 조정합니다. 유연한 만큼, 본인이 어떤 기준으로 움직이는지를 분명히 알려주면 신뢰가 단단해집니다."],["스트레스·소진 신호","변화도 안정도 하나로 정리되지 않거나, 계속 양쪽을 오가며 조율해야 할 때 피로가 쌓입니다. ‘결정 피로’가 약한 고리입니다."],["성장 연습","상황마다 휘둘리기보다 내가 중요하게 여기는 한두 가지 기준을 미리 정해두기. 어떤 상황에서 변화 쪽으로, 어떤 상황에서 안정 쪽으로 기우는지 스스로 관찰해보기."]],"strength":"유연성 · 균형감 · 상황 적응력 · 조율력","reflect":"“나는 어떤 상황에서 새로움 쪽으로, 어떤 상황에서 안정 쪽으로 기우나요?” 양쪽을 다 가진 사람의 질문은 ‘어느 쪽이냐’가 아니라 ‘언제 어느 쪽이냐’입니다."}},"HA":{"core":"위험회피는 위험·불확실성·처벌 신호 앞에서 행동을 얼마나 멈추고 경계하는가를 보여주는 회피 동기 체계입니다. 높은 사람은 잘못될 가능성을 예민하게 감지해 미리 대비하고, 낮은 사람은 위험보다 가능성에 주목하며 비교적 편안하게 나아갑니다.","reflect":"“이 조심스러움이 나를 지켜주나요, 나를 멈춰 세우나요?”","high":{"lens":[["업무 스타일","일을 시작하기 전에 위험 요소를 꼼꼼히 점검하고 실수하지 않으려 준비를 많이 합니다. 준비가 충분하면 안정적으로 잘 해내며 세밀한 관찰력이 필요한 일에서 강점을 보입니다. 다만 불확실성이 큰 과제 앞에서는 시작이 늦어지고 최악의 시나리오를 먼저 떠올리느라 에너지를 많이 씁니다."],["협업·소통","신중하고 책임감 있게 자기 몫을 챙겨 신뢰를 줍니다. 위험을 미리 짚어주는 ‘브레이크’ 역할을 하지만, 추진력 강한 동료에게는 걱정이 많거나 소심하다고 오해받을 수 있습니다."],["리더십 스타일","위험 관리형. 위험을 미리 살피고 안전장치를 마련해 팀을 보호합니다. 충분한 예고·설명·준비 시간을 제공하는 환경에서 안정적으로 움직입니다."],["스트레스·소진 신호","예기불안이 커지면 잠을 설치거나 사소한 일에도 긴장이 올라가고 쉽게 지칩니다. ‘쉽게 지침’은 타고난 기질이라기보다 지금의 소진 상태를 반영할 수 있어 따로 살펴볼 지점입니다."],["성장 연습","작은 도전을 단계적으로 시도해 ‘해냈다’는 경험 쌓기, 머릿속 걱정을 말이나 글로 꺼내 객관화하기, 새로운 상황에 천천히 노출되며 익숙해지기."]],"strength":"신중함 · 책임감 · 세밀한 관찰력 · 위기 대비력","env":"충분한 예고와 설명이 있고, 천천히 적응할 시간이 주어지며, 예측 가능한 일상과 안정감 있는 반응이 있는 환경.","misread":"겁이 많다 · 예민하다 · 소심하다 · 지나치게 걱정한다"},"low":{"lens":[["업무 스타일","불확실성에 크게 위축되지 않고 걱정보다 행동이 먼저 나옵니다. 새 시도나 모험적 과제에 거리낌 없이 뛰어들고 실패한 뒤에도 비교적 빠르게 회복해 다시 시도합니다. 다만 위험 신호를 가볍게 보거나 준비 없이 밀어붙이다 실수가 생길 수 있습니다."],["협업·소통","긴장 상황에서도 침착해 팀에 안정감을 줍니다. 대담하게 의견을 내고 빠르게 움직이지만, 조심스러운 동료에게는 ‘너무 대담하다’, ‘조심성이 부족하다’고 비칠 수 있습니다."],["리더십 스타일","도전 주도형. 위기에서 흔들리지 않고 가능성에 집중해 팀을 끌고 갑니다. 실패를 과하게 비난하지 않고 자유롭게 시도하도록 허용할 때 팀의 잠재력이 살아납니다."],["스트레스·소진 신호","위험을 과소평가해 일을 키우거나, 무리하게 밀어붙이다 뒤늦게 부담이 몰려오는 형태로 나타납니다."],["성장 연습","행동 전 결과를 한 번 예상해보기, 위험 신호를 한 번 더 살펴보기, 멈추고 점검하는 습관 들이기."]] const COMBO={"NS_HA":{"++":{"n":"끌리면서 망설이는 양가형","b":"새로운 기회를 보면 가슴이 먼저 뛰지만, 곧바로 ‘잘못되면 어떡하지’ 하는 마음이 따라붙습니다. 가고 싶은 마음과 멈추고 싶은 마음이 동시에 켜지다 보니, 시작하기 전에 누구보다 오래 고민하고 여러 경우의 수를 머릿속으로 그려 봅니다. 잘 풀릴 때는 충분히 준비한 뒤에 움직이는 믿음직한 모험가가 되지만, 설렘과 두려움이 팽팽하게 맞설 때는 결정이 한없이 길어지고 하고 싶은 일을 스스로 가로막기도 합니다. 그래서 지금 나를 망설이게 하는 것이 진짜 위험인지 익숙한 불안인지 구분하는 일이 늘 중요합니다.","s":"새로움을 향한 추진력과 위험을 살피는 신중함을 함께 지녀서 무모하지 않게 도전합니다.","c":"고민이 길어지면 마음이 지치고, 완벽한 때를 기다리다 정작 시작할 기회를 놓치기 쉽습니다.","w":{"NS":"끌리는 마음이 더 앞설 때예요. 작게 한번 시작해 본 다음 점검하는 순서가 잘 맞습니다.","HA":"조심스러운 마음이 더 앞설 때예요. 충분히 살펴본 다음 한 걸음 내딛는 순서가 잘 맞습니다."},"r":"지금 나를 멈춰 세우는 건 진짜 위험인가요, 아니면 익숙한 불안인가요?"},"+-":{"n":"거침없는 개척형","b":"마음이 끌리면 망설이지 않고 곧장 뛰어듭니다. 새로움을 좇는 추진력에 위험을 두려워하지 않는 대담함까지 더해져서, 다른 사람들이 주저하는 일을 가장 먼저 시작하는 사람입니다. 일단 부딪쳐 보고 빠르게 배우며, 실패해도 금세 털고 일어나는 회복력이 큰 무기입니다. 다만 위험 신호를 가볍게 넘기거나 준비 없이 밀어붙이다가, 벌여 놓은 일의 뒷감당이 한꺼번에 돌아오기도 합니다. 속도가 강점인 만큼 어디에 한 번쯤 브레이크를 둘지 스스로 정해 두면 그 추진력이 더 멀리 갑니다.","s":"빠르게 결정하고 실행하며, 넘어져도 다시 일어서는 회복력이 강합니다.","c":"속도가 빨라 위험을 가볍게 보기 쉽고, 여러 일을 동시에 벌이다 감당이 어려워질 수 있습니다.","w":{"NS":"새로운 것에 끌리는 마음이 더 앞설 때예요. 한 번에 벌이는 일의 양을 줄이는 연습이 도움이 됩니다.","HA":"그래도 위험을 살피는 마음이 조금은 남아 있을 때예요. 그 감각을 출발 전 점검 목록으로 활용해 보세요."},"r":"나는 어디에 브레이크를 하나쯤 달아 두고 싶나요?"},"-+":{"n":"안전을 지키는 신중형","b":"새로운 것에 크게 끌리지 않고 위험에는 민감해서, 안정과 예측 가능성을 가장 중요하게 여깁니다. 익숙한 방식을 꾸준히 지키고 돌다리도 두드려 보고 건너기 때문에 실수가 적고 곁에 있는 사람들에게 안정감을 줍니다. 맡은 자리를 흔들림 없이 지켜 내는 든든함이 큰 강점입니다. 다만 변화나 새로운 기회 앞에서 ‘굳이 그렇게까지’ 하는 마음이 들어 한발 물러서기 쉽고, 안전한 자리에서 벗어나는 데 평소보다 많은 힘이 듭니다. 이 신중함이 나를 지켜 주는지 아니면 나를 멈춰 세우는지 가끔 살펴볼 필요가 있습니다.","s":"꾸준하고 믿을 수 있으며, 위기를 미리 대비하는 힘이 있습니다.","c":"안전을 우선하다 보니 좋은 기회 앞에서도 물러서거나 한자리에 머무르기 쉽습니다.","w":{"HA":"위험을 피하려는 마음이 더 앞설 때예요. 작은 도전을 일부러 일정에 넣어 두면 균형이 잡힙니다.","NS":"그래도 새로움을 향한 호기심이 조금은 남아 있을 때예요. 그 호기심을 변화의 실마리로 키워 보세요."},"r":"이 안전함은 나를 지켜 주나요, 아니면 나를 멈춰 세우나요?"},"--":{"n":"느긋한 안정형","b":"새로운 것에도 위험에도 크게 흔들리지 않는 평온함이 있습니다. 굳이 새 일을 찾아 나서지도 않고 위험을 겁내지도 않아서, 웬만한 일에는 마음이 출렁이지 않습니다. 함께 있으면 편안하고 안정적이라는 인상을 주는 사람입니다. 다만 앞으로 나아가려는 추진력과 위험을 살피는 경계심이 둘 다 옅다 보니, 다가오는 변화의 신호도 조심해야 할 위험의 신호도 놓치기 쉽습니다. ‘이대로도 괜찮다’는 마음이 편안함을 넘어 한자리에 머무는 정체가 되지 않도록 살펴보면 좋습니다.","s":"어지간한 일에 흔들리지 않는 평정심과 안정감이 있습니다.","c":"마음이 너무 느긋해서 필요한 변화도, 살펴야 할 위험도 함께 지나치기 쉽습니다.","w":{"NS":"먼저 내가 무엇을 향하고 싶은지 방향을 정하는 일이 도움이 됩니다.","HA":"둘 중 조금이라도 더 또렷한 쪽을 작은 동력으로 삼아 보세요."},"r":"지금의 평온함은 충분함에서 오나요, 아니면 회피에서 오나요?"}},"NS_RD":{"++":{"n":"사람과 새로움으로 켜지는 활기형","b":"새로운 경험과 사람들과의 연결, 이 두 가지에서 동시에 힘을 얻습니다. 모임의 분위기를 띄우고 새로운 시도를 함께 벌이며, 사람과 자극이 풍부할 때 가장 환하게 빛나는 사람입니다. 주변에 활기를 불어넣고 사람을 모으는 힘이 큰 매력입니다. 다만 동력이 둘 다 바깥에서 오다 보니, 새로운 자극이 끊기거나 인정받지 못한다고 느끼면 빠르게 가라앉고 다른 사람의 반응에 기분이 크게 흔들립니다. 내 에너지가 안에서 차오르는지 밖에서 채워지는지 가끔 들여다보면 그 활기를 더 오래 지킬 수 있습니다.","s":"활력과 친화력이 넘치고, 사람들과 함께 새로운 시도를 즐깁니다.","c":"자극과 인정이 사라지면 쉽게 공허해지고, 다른 사람의 평가에 마음이 흔들립니다.","w":{"NS":"새로운 자극을 좇는 마음이 더 앞설 때예요. 사람을 자극의 수단처럼 대하지 않도록 살펴보면 좋습니다.","RD":"인정받고 싶은 마음이 더 앞설 때예요. 칭찬이 없어도 흔들리지 않을 나만의 기준을 챙겨 보세요."},"r":"내 에너지는 안에서 차오르나요, 아니면 밖에서 채워지나요?"},"+-":{"n":"혼자 달리는 탐험형","b":"새로운 것에는 강하게 끌리지만 사람들과의 연결에는 크게 기대지 않습니다. 관심이 가는 일을 자기 속도로 깊고 멀리 파고드는 자유로운 탐험가라서, 혼자 있어도 동력이 잘 식지 않습니다. 누가 알아주지 않아도 스스로 길을 내며 나아가는 추진력이 강점입니다. 다만 주변 사람의 마음을 덜 살피다 보니 ‘혼자 앞서간다’거나 ‘같이 가는 사람을 잊는다’는 인상을 주기도 하고, 함께 일할 때 마찰이 생기기도 합니다. 내가 향하는 길에 함께 걷는 사람을 한 번씩 돌아보면 그 추진력이 더 단단해집니다.","s":"혼자서도 깊이 몰입하며, 누가 알아주지 않아도 스스로 길을 냅니다.","c":"주변의 마음을 덜 챙기다 보니 함께 일하는 사람들과 거리가 생기기 쉽습니다.","w":{"NS":"관심 가는 일이 늘 우선일 때예요. 함께하는 사람을 의식적으로 챙기는 연습이 도움이 됩니다.","RD":"사람을 향한 관심이 조금은 남아 있을 때예요. 그 마음을 협업의 다리로 써 보세요."},"r":"내가 향하는 길에, 함께 걷는 사람을 챙기고 있나요?"},"-+":{"n":"곁을 지키는 다정형","b":"새로운 것보다 익숙한 것을, 그리고 사람들과의 따뜻한 연결을 소중히 여깁니다. 오래 알고 지낸 안정된 관계 안에서 가장 편안하고, 곁에 있는 사람을 살뜰히 챙기는 다정한 사람입니다. 관계를 따뜻하게 이어 가는 힘이 큰 강점입니다. 다만 변화나 낯선 만남 앞에서는 위축되기 쉽고, 익숙하고 안전한 관계 안에만 머무르려다 새로운 인연이나 기회를 놓치기도 합니다. 익숙함이 나에게 안정인지 아니면 새로움을 피하려고 둘러친 울타리인지 가끔 가늠해 보면 좋습니다.","s":"따뜻하게 곁을 지키며, 사람들에게 안정감을 주고 관계를 오래 이어 갑니다.","c":"변화를 피하려다 익숙한 관계 안에만 머물러 새로운 만남이나 기회를 놓치기 쉽습니다.","w":{"RD":"관계가 마음의 중심일 때예요. 관계를 잃을까 봐 변화를 피하고 있지는 않은지 살펴보세요.","NS":"새로움을 향한 마음이 조금은 남아 있을 때예요. 익숙한 사람과 함께 작은 새 시도를 해 보면 좋습니다."},"r":"익숙함이 나에게 안정인가요, 아니면 새로움을 피하는 울타리인가요?"},"--":{"n":"조용한 독립형","b":"새로운 자극도 사람들과의 연결도 크게 찾아 나서지 않습니다. 혼자만의 익숙한 공간에서 차분히 깊어지는 사람이라, 바깥일에 쉽게 휘둘리지 않고 스스로 만족할 줄 압니다. 외부의 평가나 유행에 흔들리지 않는 단단함이 강점입니다. 다만 자극도 관계도 잘 찾지 않다 보니 세계가 점점 좁아지거나 혼자 고립되기 쉽고, 도움이 필요한 순간에도 혼자 끌어안기 쉽습니다. 나의 고요함이 충만함에서 오는지 아니면 단절에서 오는지 한 번씩 살펴보면 좋습니다.","s":"혼자서도 차분히 깊어지며, 바깥에 휘둘리지 않고 스스로 만족합니다.","c":"자극도 관계도 잘 찾지 않다 보니 세계가 좁아지거나 고립되기 쉽습니다.","w":{"RD":"누구와 이어지고 싶은지를 작게 정해 보는 일이 도움이 됩니다.","NS":"둘 중 조금이라도 더 또렷한 쪽으로 첫 문을 열어 보세요."},"r":"나의 고요함은 충만함에서 오나요, 아니면 단절에서 오나요?"}},"NS_P":{"++":{"n":"벌이고 끝까지 가는 추진가","b":"새로운 일을 빠르게 시작하는 추진력과, 한번 잡으면 끝까지 밀고 가는 끈기를 함께 지녔습니다. 시작하는 힘과 마무리하는 힘을 모두 갖춘 보기 드문 유형이라, 일을 만들어 내고 결과까지 내는 강한 추진력을 가졌습니다. 새 일을 벌이는 데도, 그 일을 끝맺는 데도 능하다는 점이 큰 강점입니다. 다만 두 힘이 모두 강하다 보니 쉴 새 없이 새 일을 벌이면서 이미 시작한 일도 놓지 못해, 스스로 멈추기를 가장 어려워합니다. 무엇을 시작하고 무엇은 시작하지 않을지 고르는 힘을 기르면 그 에너지가 번아웃으로 새지 않습니다.","s":"시작하는 힘과 끝까지 해내는 힘을 모두 갖춘 드문 실행가입니다.","c":"쉴 새 없이 벌이고 끝까지 붙들다 보니 멈출 때를 놓쳐 지치기 쉽습니다.","w":{"NS":"새 일을 벌이려는 마음이 더 앞설 때예요. 시작한 일을 끝까지 마무리하도록 돕는 장치를 곁에 두면 좋습니다.","P":"끝까지 붙들려는 마음이 더 앞설 때예요. 언제 멈출지를 미리 정해 두는 일이 중요합니다."},"r":"무엇을 시작하고, 무엇은 시작하지 않을지 고르는 힘이 있나요?"},"+-":{"n":"불꽃 점화형","b":"시작은 빠르고 화려하지만 한 가지를 오래 붙드는 끈기는 약한 편입니다. 아이디어가 샘솟고 새 일을 잘 벌여서, 무언가를 처음 열고 분위기를 띄우는 자리에서 가장 빛납니다. 막힌 곳에 불을 붙이는 점화 능력이 큰 매력입니다. 다만 흥미가 식으면 마무리하기 전에 손을 놓기 쉬워서, 일을 벌여만 놓는다는 말을 듣고 끝맺지 못한 일이 쌓이기도 합니다. 끝맺음을 도와줄 장치, 이를테면 마감일이나 함께할 사람을 곁에 두면 그 불꽃이 결과로 이어집니다.","s":"아이디어가 풍부하고 시작이 빨라서 막힌 곳에 활기를 불어넣습니다.","c":"흥미가 식으면 마무리 전에 손을 놓기 쉬워 끝맺지 못한 일이 쌓입니다.","w":{"NS":"새 일을 벌이려는 마음이 더 앞설 때예요. 새로 시작하는 속도를 조금 늦추는 연습이 도움이 됩니다.","P":"끈기가 조금은 남아 있을 때예요. 그 힘을 ‘딱 하나만 끝내기’에 모아 보세요."},"r":"끝맺음을 도와줄 장치를 어디에 두면 좋을까요?"},"-+":{"n":"묵묵한 완주형","b":"새로 시작하는 데는 더디지만 한번 잡은 일은 끝까지 해냅니다. 요란하지 않게 익숙한 길을 꾸준히 걸어가기 때문에 곁에서 믿고 맡길 수 있고, 결과의 완성도도 높습니다. 맡은 일을 끝까지 책임지는 성실함이 큰 강점입니다. 다만 큰 변화나 새로운 방식 앞에서는 시작이 늦고, 효율이 떨어지는 길도 ‘이미 시작했으니’ 하며 끝까지 붙들다 더 나은 방향을 지나치기도 합니다. 지금 붙들고 있는 길이 여전히 내가 가고 싶은 길인지 한 번씩 확인해 보면 좋습니다.","s":"꾸준하고 완성도가 높으며, 맡은 일을 끝까지 책임집니다.","c":"한번 시작한 일을 놓기 어려워 더 나은 방향으로 바꾸는 데 더딥니다.","w":{"P":"끝까지 붙들려는 마음이 더 앞설 때예요. ‘여기서 그만둬도 된다’는 기준을 정해 두면 좋습니다.","NS":"새로움을 향한 호기심이 조금은 남아 있을 때예요. 작은 새 시도를 정기적으로 열어 두세요."},"r":"지금 붙들고 있는 이 길은, 여전히 내가 가고 싶은 길인가요?"},"--":{"n":"흐름을 따르는 여유형","b":"굳이 새 일을 벌이지도, 억지로 끝까지 밀어붙이지도 않으면서 상황의 흐름에 자연스럽게 몸을 맡깁니다. 욕심 없이 유연한 태도가 주변을 편안하게 하고, 작은 일에 매이지 않습니다. 무엇에도 크게 집착하지 않는 여유로움이 강점입니다. 다만 앞으로 나아가려는 추진력과 끝까지 가는 지속력이 둘 다 옅다 보니, 스스로 무언가를 시작하거나 끝까지 끌고 가야 할 때 자꾸 미루거나 한자리에 머물기 쉽습니다. 이 여유로움이 나에게 자유인지 아니면 회피인지 가끔 들여다보면 좋습니다.","s":"무엇에도 크게 매이지 않는 여유와 유연함이 있습니다.","c":"추진력과 지속력이 둘 다 옅어 시작도 마무리도 자꾸 미뤄지기 쉽습니다.","w":{"NS":"‘반드시 끝내고 싶은 한 가지’를 먼저 정하는 일이 도움이 됩니다.","P":"둘 중 조금이라도 더 또렷한 쪽을 그 한 가지의 동력으로 삼아 보세요."},"r":"이 여유로움은 나에게 자유인가요, 아니면 회피인가요?"}},"HA_RD":{"++":{"n":"조심스럽게 살피는 배려형","b":"다가올 위험과 다른 사람의 감정, 이 두 가지 신호를 모두 예민하게 알아챕니다. 분위기의 미묘한 변화와 아직 드러나지 않은 문제를 먼저 감지해서, 갈등을 미리 막고 사람을 세심하게 돌봅니다. 사람과 상황을 함께 살피는 섬세함이 큰 강점입니다. 다만 ‘잘못되면 어쩌지’ 하는 걱정과 ‘상대가 어떻게 느낄까’ 하는 마음이 겹쳐 늘 긴장한 상태가 되기 쉽고, 거절을 어려워해서 마음이 가장 빨리 닳는 유형이기도 합니다. 이 조심스러움이 나를 위한 것인지 다른 사람을 위한 것인지 구분해 보면 한결 가벼워집니다.","s":"사람과 상황을 함께 살피는 섬세함으로 갈등을 미리 막고 사람을 돌봅니다.","c":"걱정과 눈치가 겹쳐 늘 긴장하기 쉽고, 거절을 어려워해 마음이 빨리 지칩니다.","w":{"HA":"안전을 향한 걱정이 더 앞설 때예요. 내가 어쩔 수 없는 일은 내려놓는 연습이 도움이 됩니다.","RD":"다른 사람을 살피는 마음이 더 앞설 때예요. 거절하고 선을 긋는 연습이 필요합니다."},"r":"이 조심스러움은 나를 위한 것인가요, 아니면 다른 사람을 위한 것인가요?"},"+-":{"n":"신중한 자기수호형","b":"위험에는 민감하지만 다른 사람의 감정에는 크게 휘둘리지 않습니다. 감정에 휩쓸리지 않고 차분히 스스로를 지키며 독립적으로 판단하는 사람입니다. 자기 안전과 기준을 잘 챙기는 단단함이 강점입니다. 다만 위험을 경계하는 태도가 사람에게는 거리를 두는 모습으로 비쳐서, 신중함이 차갑거나 방어적인 인상으로 읽히기도 합니다. 나의 경계가 나를 지켜 주는지 아니면 사람들과 나를 갈라놓는지 한 번씩 살펴보면 좋습니다.","s":"감정에 휩쓸리지 않고 차분히 스스로를 지키며 독립적으로 판단합니다.","c":"위험을 경계하는 태도가 사람에게 거리를 두거나 방어적인 인상으로 비치기 쉽습니다.","w":{"HA":"위험을 경계하는 마음이 더 앞설 때예요. 안전을 확인한 다음 한 걸음 다가서 보세요.","RD":"사람을 향한 관심이 조금은 남아 있을 때예요. 그 마음을 한 마디로 표현해 보세요."},"r":"나의 경계는 나를 지켜 주나요, 아니면 사람들과 나를 갈라놓나요?"},"-+":{"n":"겁 없는 마당발형","b":"위험에는 대담하고 사람에게는 따뜻합니다. 낯선 자리에도 거리낌 없이 들어가 사람들과 빠르게 가까워지는 활달한 사람이라, 관계의 폭이 넓고 새로운 도전도 즐깁니다. 사람을 끌어당기는 친화력과 겁 없는 대담함이 매력입니다. 다만 위험을 가볍게 보고 일을 벌이거나, 사람들의 반응과 기대에 휘둘려 거절하지 못하고 너무 많은 것을 떠안기도 합니다. 나의 대담함과 다정함이 혹시 나를 지치게 하고 있지는 않은지 살펴보면 좋습니다.","s":"사람을 끌어당기는 친화력과 겁 없는 대담함으로 넓게 어울립니다.","c":"위험을 가볍게 보거나 사람들의 기대에 휘둘려 너무 많은 것을 떠안기 쉽습니다.","w":{"RD":"사람을 향한 마음이 더 앞설 때예요. 떠안기 전에 거절할 기준을 정해 두면 좋습니다.","HA":"위험을 살피는 마음이 조금은 남아 있을 때예요. 그 감각으로 일을 벌이기 전에 한 번 점검해 보세요."},"r":"나의 대담함과 다정함이, 혹시 나를 지치게 하고 있지는 않나요?"},"--":{"n":"담담한 독행형","b":"위험에도 다른 사람의 평가에도 크게 흔들리지 않습니다. 마음이 잘 동요하지 않고 독립적이라 혼자서도 단단하고, 어지간한 일에 일희일비하지 않습니다. 외부에 휘둘리지 않는 평정심이 강점입니다. 다만 위험을 알리는 신호도 사람의 마음을 알리는 신호도 둘 다 덜 챙기다 보니, 정작 조심해야 할 순간이나 사람을 살펴야 할 순간을 지나치기 쉽습니다. 나의 단단함이 자유에서 오는지 아니면 무관심에서 오는지 한 번씩 돌아보면 좋습니다.","s":"외부에 휘둘리지 않는 평정심으로 혼자서도 단단하게 자기 길을 갑니다.","c":"위험과 사람의 신호를 둘 다 덜 살펴 조심하거나 챙겨야 할 순간을 지나치기 쉽습니다.","w":{"HA":"꼭 살펴야 할 위험은 무엇인지 의식적으로 점검하는 일이 도움이 됩니다.","RD":"둘 중 조금이라도 더 또렷한 쪽부터 마음을 기울여 보세요."},"r":"나의 단단함은 자유에서 오나요, 아니면 무관심에서 오나요?"}},"HA_P":{"++":{"n":"꼼꼼히 끝까지 가는 완성형","b":"위험을 미리 살피는 신중함과 끝까지 해내는 끈기가 만나, 빈틈없이 일을 완성합니다. 작은 디테일까지 챙기고 맡은 책임을 끝까지 지기 때문에 곁에서 깊이 신뢰하는 사람입니다. 무엇을 맡겨도 안심할 수 있는 완성도가 큰 강점입니다. 다만 ‘완벽해야 한다’는 마음과 ‘잘못되면 안 된다’는 걱정이 겹쳐 스스로를 강하게 몰아붙이고, 멈추거나 쉬는 일을 가장 어려워합니다. ‘이만하면 됐다’고 말할 수 있는 기준을 어디에 둘지 정해 두면 그 성실함이 나를 갉아먹지 않습니다.","s":"디테일을 챙기고 끝까지 책임져 무엇을 맡겨도 안심할 수 있는 완성도를 냅니다.","c":"완벽하려는 마음과 걱정이 겹쳐 스스로를 몰아붙이고, 쉬는 일을 가장 어려워합니다.","w":{"HA":"걱정하는 마음이 더 앞설 때예요. 확실하지 않은 상태를 견디는 연습이 도움이 됩니다.","P":"끝까지 해내려는 마음이 더 앞설 때예요. ‘이만하면 됐다’의 기준을 정하는 일이 중요합니다."},"r":"‘충분히 했다’는 기준을 나는 어디에 두고 있나요?"},"+-":{"n":"신중한 관망형","b":"위험은 미리 살피지만 끝까지 밀어붙이는 끈기는 약한 편입니다. 무리하지 않고 안전하게 가다가 아니다 싶으면 일찍 손을 거두는 현실 감각이 있어서 큰 손실은 잘 피합니다. 위험을 가늠하고 유연하게 물러설 줄 아는 신중함이 강점입니다. 다만 걱정이 앞서 시작 자체를 미루거나, 어려움이 닥치면 끝맺기 전에 물러서서 좋은 일도 끝까지 가져가지 못하기도 합니다. 지금의 멈춤이 지혜로운 판단인지 아니면 회피인지 구분해 보면 좋습니다.","s":"위험을 가늠하고 유연하게 물러설 줄 알아 큰 손실을 잘 피합니다.","c":"걱정이 앞서 시작을 미루거나, 어려움 앞에서 끝맺기 전에 물러서기 쉽습니다.","w":{"HA":"시작하기 전의 걱정이 더 앞설 때예요. 우선 작게 시작해 보는 일이 도움이 됩니다.","P":"끈기가 조금은 남아 있을 때예요. 그 힘을 ‘중요한 하나’를 끝까지 가져가는 데 써 보세요."},"r":"지금의 이 멈춤은 지혜인가요, 아니면 회피인가요?"},"-+":{"n":"흔들림 없는 돌파형","b":"위험에 겁먹지 않고 목표를 향해 끝까지 밀어붙입니다. 어려운 상황에서도 물러서지 않고 부딪쳐 나가는 강한 추진력과 회복력을 지녔습니다. 한번 마음먹은 일을 기어이 해내는 돌파력이 큰 강점입니다. 다만 위험을 충분히 살피지 않고 밀어붙이다 무리하거나, ‘할 수 있다’는 확신이 지나쳐 경고 신호를 놓치기도 합니다. 나의 돌파가 용기에서 나오는지 아니면 과신에서 나오는지 한 번씩 점검해 보면 좋습니다.","s":"어려움 앞에서도 물러서지 않고 끝까지 부딪쳐 기어이 해냅니다.","c":"위험을 충분히 살피지 않고 밀어붙이다 무리하거나 경고 신호를 놓치기 쉽습니다.","w":{"P":"끝까지 해내려는 마음이 더 앞설 때예요. 멈춰서 점검할 지점을 미리 정해 두면 좋습니다.","HA":"위험을 살피는 마음이 조금은 남아 있을 때예요. 그 감각으로 ‘무리하는 신호’를 미리 정해 두세요."},"r":"나의 돌파는 용기에서 나오나요, 아니면 과신에서 나오나요?"},"--":{"n":"유유자적형","b":"위험도 두려워하지 않고 굳이 끝까지 매달리지도 않으면서, 상황에 따라 느긋하게 흘러갑니다. 작은 일에 마음이 흔들리지 않는 낙천과 여유가 있어서 함께 있으면 마음이 편안해집니다. 어지간한 일에 동요하지 않는 가벼움이 강점입니다. 다만 위험을 살피는 경계심과 끝까지 가는 지속력이 둘 다 옅다 보니, 조심해야 할 위험을 놓치거나 중요한 일을 끝맺지 못한 채 흘려보내기 쉽습니다. 이 느긋함이 나를 어디로 데려가고 있는지 가끔 살펴보면 좋습니다.","s":"작은 일에 흔들리지 않는 낙천과 여유로 주변을 편안하게 합니다.","c":"경계심과 지속력이 둘 다 옅어 위험을 놓치거나 일을 끝맺지 못하기 쉽습니다.","w":{"HA":"‘끝까지 가져갈 한 가지’와 거기 따르는 위험을 함께 정해 보는 일이 도움이 됩니다.","P":"둘 중 조금이라도 더 또렷한 쪽을 그 일의 안전장치로 삼아 보세요."},"r":"이 느긋함은 나를 어디로 데려가고 있나요?"}},"RD_P":{"++":{"n":"관계를 끝까지 책임지는 헌신형","b":"사람을 향한 깊은 관심과 끝까지 해내는 끈기가 만나, 사람도 일도 끝까지 챙기는 든든한 사람이 됩니다. 한번 맡은 관계와 책임을 좀처럼 놓지 않아서 주변이 크게 의지합니다. 끝까지 곁을 지키고 책임을 다하는 헌신이 큰 강점입니다. 다만 ‘끝까지 해내야 한다’는 책임감과 ‘저 사람을 실망시키면 안 된다’는 마음이 겹쳐, 자기 몫이 아닌 일까지 떠안다가 지치기 쉽습니다. 내가 떠안은 것 가운데 내려놓아도 되는 것이 무엇인지 가려내 보면 그 헌신이 오래갑니다.","s":"끝까지 곁을 지키고 책임을 다하는 헌신으로 사람도 일도 끝까지 챙깁니다.","c":"책임감과 관계 부담이 겹쳐 자기 몫이 아닌 일까지 떠안다가 지치기 쉽습니다.","w":{"RD":"관계에 대한 책임감이 더 앞설 때예요. ‘이건 내 몫이 아니다’를 가려내는 일이 도움이 됩니다.","P":"끝까지 해내려는 책임감이 더 앞설 때예요. ‘그만둬도 되는 것’을 정해 두면 좋습니다."},"r":"내가 떠안은 것 가운데, 내려놓아도 되는 것은 무엇인가요?"},"+-":{"n":"마음을 잇는 조율형","b":"사람과 관계에는 깊이 마음을 쓰지만 한 가지 일을 끝까지 붙드는 데는 유연한 편입니다. 사람들 사이의 감정을 잘 읽고 분위기를 부드럽게 이어 주어서, 함께 있는 자리를 매끄럽게 만드는 사람입니다. 사람과 사람을 잇고 마음을 살피는 공감이 큰 강점입니다. 다만 한 가지 일을 끝까지 가져가는 힘이 약하고, 사람을 챙기다 보면 정작 자기 일이 뒤로 밀리거나 관계에 끌려다니기도 합니다. 사람을 챙기느라 내 일을 놓치고 있지는 않은지 한 번씩 돌아보면 좋습니다.","s":"사람들 사이의 감정을 잘 읽고 분위기를 부드럽게 이어 줍니다.","c":"한 가지를 끝까지 가져가는 힘이 약하고, 사람을 챙기다 자기 일을 놓치기 쉽습니다.","w":{"RD":"관계가 마음의 중심일 때예요. 내 일의 마감을 먼저 지키는 연습이 도움이 됩니다.","P":"끈기가 조금은 남아 있을 때예요. 그 힘을 ‘내 일 하나’에 먼저 써 보세요."},"r":"사람을 챙기느라, 정작 내 일을 놓치고 있지는 않나요?"},"-+":{"n":"묵묵한 장인형","b":"사람보다 일에, 그리고 끝까지 해내는 데 집중합니다. 감정의 잡음에 휘둘리지 않고 일에 깊이 몰두해서 높은 완성도를 내는 사람이라, 혼자서도 묵묵히 const $=s=>document.querySelector(s);
const root=$("#root");
let queue=[], answers={}, qi=0, lastResult=null;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildQueue(){
  let arr=[]; ORDER.forEach(d=>ITEMS[d].forEach((t,i)=>arr.push({d,t,id:d+i})));
  return shuffle(arr);
}
function band(s){return s<=25?"매우 낮음":s<=33?"낮음":s<=38?"중간":s<=46?"높음":"매우 높음";}
function pole(s){return s>=39?"+":s<=33?"-":"o";}
function lvKind(s){return s>=39?"high":s<=33?"low":"mid";}
function scores(){const o={};ORDER.forEach(d=>{let s=0;ITEMS[d].forEach((t,i)=>{s+=answers[d+i]||0;});o[d]=s;});return o;}

function pairKey(a,b){return PAIRLIST.some(p=>p[0]===a&&p[1]===b)?[a,b]:[b,a];}

function intro(){
  root.innerHTML=`
   <div class="dots reveal"><i style="background:var(--coral)"></i><i style="background:var(--blue)"></i><i style="background:var(--green)"></i><i style="background:var(--purple)"></i></div>
   <div class="kicker reveal">Temperament Profile · 기질 프로파일</div>
   <h1 class="reveal">나를 움직이는<br><em>네 가지 기질</em></h1>
   <p class="lead reveal">자극추구 · 위험회피 · 사회적 민감성 · 인내력.<br>평소의 나를 떠올리며 답하면, 내 안에서 가장 뚜렷한 결부터 보여드립니다.</p>
   <div class="specs reveal">
     <div class="r"><span>소요 시간</span><span class="v">약 5분</span></div>
     <div class="r"><span>문항</span><span class="v">48 · 5점 척도</span></div>
     <div class="r"><span>근거</span><span class="v">TCI 기질 4차원</span></div>
   </div>
   <button class="btn solid reveal" id="start">검사 시작하기</button>
   <button class="mini" id="demo">예시 결과 미리보기</button>
   <div class="anchor reveal"><div class="av">조</div><div class="nm">예술심리치료사 조세화<small>리네아스토리 · 알음다움</small></div></div>
   <p class="foot reveal">표준화 규준이 없는 자기이해 도구입니다. 결과는 우열이 아니라 ‘나를 이해하는 출발점’으로 읽어 주세요.</p>`;
  $("#start").onclick=()=>{queue=buildQueue();answers={};qi=0;quiz();};
  $("#demo").onclick=()=>{demoFill();result();};
}
function demoFill(){answers={};ITEMS.NS.forEach((t,i)=>answers["NS"+i]=[5,5,4,5,4,4,4,5,4,4,4,3][i]);ITEMS.HA.forEach((t,i)=>answers["HA"+i]=[2,2,3,2,2,2,3,2,3,2,3,2][i]);ITEMS.RD.forEach((t,i)=>answers["RD"+i]=3);ITEMS.P.forEach((t,i)=>answers["P"+i]=[4,4,4,4,4,4,4,4,3,4,4,4][i]);}

function quiz(){
  const it=queue[qi], pct=Math.round((qi)/queue.length*100);
  root.innerHTML=`
   <div class="qtop"><div><b>${qi+1}</b> / ${queue.length}</div><div>5점 척도</div></div>
   <div class="bar"><i style="width:${pct}%"></i></div>
   <div class="qtext">${it.t}</div>
   <div class="qhelp">너무 오래 고민하지 말고, 처음 떠오르는 느낌대로.</div>
   <div class="scale" id="scale"></div>
   ${qi>0?'<button class="qback" id="back">← 이전 문항</button>':''}`;
  const labels=["전혀 아니다","아니다","보통이다","그렇다","매우 그렇다"];
  const sc=$("#scale");
  labels.forEach((l,i)=>{const b=document.createElement("button");b.className="opt";b.innerHTML='<span class="ring"></span><span>'+l+'</span>';b.onclick=()=>{answers[it.id]=i+1;next();};sc.appendChild(b);});
  if(qi>0)$("#back").onclick=()=>{qi--;quiz();};
}
function next(){qi++; if(qi>=queue.length){result();}else{quiz();}}

let stepCur="summary", dimCur="NS";
function result(){
  const sc=scores();
  const meta=ORDER.map(d=>({d,score:sc[d],dev:Math.abs(sc[d]-36),pl:pole(sc[d]),band:band(sc[d])}));
  const ranked=meta.slice().sort((a,b)=>b.dev-a.dev);
  const sigs=ranked.filter(m=>m.pl!=="o");
  stepCur="summary";
  root.innerHTML=`
   <div class="rtop"><span class="k">Your Temperament</span><button class="restart" id="restart">다시하기</button></div>
   <div class="rh">내 기질 프로파일</div>
   <div class="rsub">네 기질 중 무엇이 나를 가장 뚜렷하게 움직이는지</div>
   <div class="steps">
     <button data-s="summary" class="on">요약</button>
     <button data-s="combo">핵심 조합</button>
     <button data-s="dims">척도별</button>
   </div>
   <div class="panel on" id="p-summary"></div>
   <div class="panel" id="p-combo"></div>
   <div class="panel" id="p-dims"></div>`;
  $("#restart").onclick=intro;
  document.querySelectorAll(".steps button").forEach(b=>b.onclick=()=>{
    stepCur=b.dataset.s;
    document.querySelectorAll(".steps button").forEach(x=>x.classList.toggle("on",x===b));
    ["summary","combo","dims"].forEach(s=>$("#p-"+s).classList.toggle("on",s===stepCur));
  });
  lastResult={meta,ranked,sigs,combo:computeCombo(ranked,sigs)};
  renderSummary(ranked);
  renderCombo();
  renderDims(meta);
}

function arrow(pl){return pl==="+"?'<span class="ar up">▲</span>':pl==="-"?'<span class="ar dn">▼</span>':'<span class="ar midc">―</span>';}
const SUMMARY_NOTE=`<div class="note">‘점수가 높다’가 아니라 <b>중립점(36점)에서 얼마나 벗어났는가</b>로 줄을 세웠어요. 그래서 강한 낮음(▼)도 강한 높음만큼 뚜렷한 기질로 올라옵니다.</div>`;
function summaryRowsHTML(ranked){
  return ranked.map((m,i)=>{
    const D=DIM[m.d], tag=m.pl==="+"?"강세":m.pl==="-"?"뚜렷":"균형";
    return `<div class="rrow" style="${i===0?'border-color:'+D.color:''}">
      <span class="pip" style="background:${D.color}"></span><span class="no">${i+1}</span>
      <span class="nm">${D.name}<small>${D.eng} · ${m.band}</small></span>
      <span class="ar ${m.pl==='+'?'up':m.pl==='-'?'dn':'midc'}" style="${m.pl==='+'?'color:'+D.color:''}">${m.pl==='+'?'▲':m.pl==='-'?'▼':'―'} ${tag}</span>
      <span class="val">${m.score}</span></div>`;
  }).join("");
}
function dimCardHTML(d,m){
  const D=DIM[d],k=lvKind(m.score),it=INTERP[d],data=it[k];
  const lens=data.lens.map(l=>`<div class="ln"><div class="t">${l[0]}</div><div class="x">${l[1]}</div></div>`).join("");
  const extra=k!=="mid"?`<div class="row2"><b>이런 환경에서 잘 지내요</b> · ${data.env}</div><div class="row2"><b>이런 오해를 받기도 해요</b> · ${data.misread}</div>`:"";
  const intense=(m.band==="매우 높음"||m.band==="매우 낮음")?`<div class="row2" style="color:var(--mute)"><b>강도 안내</b> · 이 경향이 특히 뚜렷해, 강점도 주의점도 더 선명하게 드러날 수 있습니다.</div>`:"";
  const rf=(k==="mid"&&data.reflect)?data.reflect:it.reflect;
  const lead=k==="mid"?data.intro:LEAD[d][k];
  return `<div class="dimcard">
     <div class="dh"><span class="t">${D.name}</span><span class="lv" style="color:${D.color}">· ${m.band} (${m.score})</span></div>
     <div class="en">${D.eng}</div>
     <div class="common">${COMMON[d]}</div>
     <div class="myhead" style="color:${D.color}">나의 ${D.name} 척도 해석</div>
     <div class="core">${lead}</div>
     ${lens}
     <div class="row2"><b>강점</b> · ${data.strength}</div>
     ${extra}${intense}
     <div class="rf">${rf}</div>
   </div>`;
}
function renderSummary(ranked){
  $("#p-summary").innerHTML=`<div class="rank">${summaryRowsHTML(ranked)}</div>${SUMMARY_NOTE}`;
}

function computeCombo(ranked,sigs){
  const sc=scores();
  if(sigs.length===0){
    return {type:"flat",pair:"모든 기질이 중간",name:FLAT.n,body:FLAT.b,strength:FLAT.s,caution:FLAT.c,weight:null,reflect:FLAT.r,third:null,color:DIM.RD.color,fill:DIM.RD.fill};
  }
  if(sigs.length===1){
    const m=sigs[0],D=DIM[m.d],k=lvKind(m.score),it=INTERP[m.d],data=it[k];
    const body=it.core+" "+(k==="mid"?data.intro:data.lens.map(l=>l[1]).slice(0,2).join(" "));
    return {type:"single",pair:D.name+" "+m.band+" · 가장 뚜렷한 한 축",name:D.name+" "+m.band,body,strength:data.strength,caution:null,weight:null,reflect:it.reflect,third:null,color:D.color,fill:D.fill,single:D.name};
  }
  const m0=sigs[0],m1=sigs[1];
  const ck=pairKey(m0.d,m1.d), ca=ck[0], cb=ck[1];
  const key=pole(sc[ca])+pole(sc[cb]);
  const c=COMBO[ca+"_"+cb][key];
  const A=DIM[ca],B=DIM[cb],lead=DIM[m0.d];
  const weight="지금은 <b>"+lead.name+"</b>"+(((lead.name.charCodeAt(lead.name.length-1)-0xAC00)%28)?"이":"가")+" 더 뚜렷합니다. "+(c.w[m0.d]||Object.values(c.w)[0]);
  let third=null;
  if(sigs.length>=3){const m2=sigs[2];third=THIRD[m2.d][m2.pl];}
  return {type:"pair",pair:A.name+" "+arrowTxt(pole(sc[ca]))+" × "+B.name+" "+arrowTxt(pole(sc[cb]))+" · 가장 뚜렷한 두 축",name:c.n,body:c.b,strength:c.s,caution:c.c,weight,reflect:c.r,third,color:lead.color,fill:lead.fill};
}
function arrowTxt(pl){return pl==="+"?"↑":pl==="-"?"↓":"○";}
function cardHTML(o){
  return `<div class="combo" style="border-color:${o.color};background:linear-gradient(180deg,${o.fill},#fff 62%)">
     <div class="pair" style="color:${o.color}">${o.pair}</div>
     <h2>“${o.name}”</h2>
     <p class="b">${o.body}</p>
     ${o.strength.includes(" · ")
       ? `<div class="kv"><span class="l" style="color:${o.color}">강점</span></div><div class="chips">${o.strength.split(" · ").map(x=>`<span class="chip" style="color:${o.color};border-color:${o.fill}">${x}</span>`).join("")}</div>`
       : `<div class="kv"><span class="l" style="color:${o.color}">강점</span> &nbsp;${o.strength}</div>`}
     ${o.caution?`<div class="kv"><span class="l" style="color:${o.color}">주의</span> &nbsp;${o.caution}</div>`:""}
     ${o.weight?`<div class="kv"><span class="l" style="color:${o.color}">무게중심</span> &nbsp;${o.weight}</div>`:""}
     <div class="qbox"><div class="qq">${o.reflect}</div></div>
     ${o.third?`<div class="third">${o.third}</div>`:""}
   </div>`;
}
function renderCombo(){
  const o=lastResult.combo;
  const extra=o.type==="single"?`<div class="note">뚜렷한 축이 하나예요. ‘척도별’ 탭에서 ${o.single} 해석을 더 자세히 볼 수 있어요.</div>`:"";
  $("#p-combo").innerHTML=cardHTML(o)+extra;
}

function renderDims(meta){
  const box=$("#p-dims");
  const tabs=ORDER.map(d=>{const D=DIM[d];const on=d===dimCur;return `<button data-d="${d}" class="${on?'on':''}" style="${on?'background:'+D.color+';color:#fff':'color:'+D.color}">${D.name}</button>`;}).join("");
  box.innerHTML=`<div class="dimhint">👆 네 척도를 눌러 자세히 보기</div><div class="dimtabs">${tabs}</div><div id="dimbody"></div>
    <div class="disc" style="margin-top:24px">중립점(36점) 기준의 상대 결과 · 표준화 규준이 없는 자기이해 도구입니다.<br>예술심리치료사 조세화 · 리네아스토리</div>
    <div class="btns"><button class="btn ghost" id="saveImg">이미지로 저장</button><button class="btn accent" id="savePdf">PDF로 저장</button></div>`;
  box.querySelectorAll(".dimtabs button").forEach(b=>b.onclick=()=>{dimCur=b.dataset.d;renderDims(meta);});
  $("#saveImg").onclick=saveImage;
  $("#savePdf").onclick=savePDF;
  const m=meta.find(x=>x.d===dimCur);
  $("#dimbody").innerHTML=dimCardHTML(dimCur,m);
}

function rptUnits(){
  const {meta,ranked,combo}=lastResult, U=[];
  U.push({type:"single", html:`<div class="u"><div class="usec">한눈에 보기 · 뚜렷한 순서</div><div class="rank">${summaryRowsHTML(ranked)}</div>${SUMMARY_NOTE}</div>`});
  U.push({type:"single", html:`<div class="u"><div class="usec">나의 대표 서사 · 핵심 조합</div>${cardHTML(combo)}</div>`});
  ORDER.forEach((d,i)=>{
    const m=meta.find(x=>x.d===d), pr=dimUnitParts(d,m);
    U.push({type:"group", a:`<div class="u">${i===0?'<div class="usec">척도별 자세히</div>':''}${pr[0]}</div>`, b:`<div class="u">${pr[1]}</div>`});
  });
  return U;
}
function dimUnitParts(d,m){
  const D=DIM[d],k=lvKind(m.score),it=INTERP[d],data=it[k];
  const lens=data.lens.map(l=>`<div class="ln"><div class="t">${l[0]}</div><div class="x">${l[1]}</div></div>`).join("");
  const extra=k!=="mid"?`<div class="row2"><b>이런 환경에서 잘 지내요</b> · ${data.env}</div><div class="row2"><b>이런 오해를 받기도 해요</b> · ${data.misread}</div>`:"";
  const intense=(m.band==="매우 높음"||m.band==="매우 낮음")?`<div class="row2" style="color:var(--mute)"><b>강도 안내</b> · 이 경향이 특히 뚜렷해, 강점도 주의점도 더 선명하게 드러날 수 있습니다.</div>`:"";
  const rf=(k==="mid"&&data.reflect)?data.reflect:it.reflect, lead=k==="mid"?data.intro:LEAD[d][k];
  const a=`<div class="dimcard"><div class="dh"><span class="t">${D.name}</span><span class="lv" style="color:${D.color}">· ${m.band} (${m.score})</span></div><div class="en">${D.eng}</div><div class="common">${COMMON[d]}</div></div>`;
  const b=`<div class="dimcard"><div class="myhead" style="color:${D.color};border-top:0;padding-top:0;margin-top:0">나의 ${D.name} 척도 해석</div><div class="core">${lead}</div>${lens}<div class="row2"><b>강점</b> · ${data.strength}</div>${extra}${intense}<div class="rf">${rf}</div></div>`;
  return [a,b];
}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
function overlay(on,msg){
  let o=document.getElementById("ovl");
  if(on){ if(!o){o=document.createElement("div");o.id="ovl";document.body.appendChild(o);} o.textContent=msg||"만드는 중…"; o.style.display="flex"; }
  else if(o){ o.style.display="none"; }
}
function showImageGallery(urls){
  const old=document.getElementById("imgmodal"); if(old)old.remove();
  const m=document.createElement("div"); m.id="imgmodal";
  const head=`<div class="im-head"><div class="im-title">이미지 저장</div><button class="im-close" type="button">닫기</button></div>`;
  const tip=`<div class="im-tip">📱 휴대폰은 아래 이미지를 <b>길게 눌러</b> ‘사진에 저장’을 선택하면 갤러리에 저장돼요.<br>💻 PC·일부 기기는 ‘이 페이지 저장’ 버튼으로 받을 수 있어요.</div>`;
  const body=urls.map((u,i)=>`<div class="im-card"><div class="im-no">${i+1} / ${urls.length} 페이지</div><img src="${u}" alt="${i+1}페이지" class="im-img"><button class="im-dl" type="button" data-i="${i}">이 페이지 저장</button></div>`).join("");
  m.innerHTML=`<div class="im-wrap">${head}${tip}<div class="im-list">${body}</div></div>`;
  document.body.appendChild(m);
  m.querySelector(".im-close").onclick=()=>m.remove();
  m.addEventListener("click",e=>{ if(e.target===m)m.remove(); });
  m.querySelectorAll(".im-dl").forEach(btn=>{
    btn.onclick=()=>{ const i=+btn.dataset.i; const a=document.createElement("a"); a.href=urls[i]; a.download="기질프로파일_"+(i+1)+".png"; document.body.appendChild(a); a.click(); a.remove(); };
  });
}
function dlCanvas(canvas,name){
  return new Promise(res=>{
    function viaURL(){ const a=document.createElement("a");a.href=canvas.toDataURL("image/png");a.download=name;document.body.appendChild(a);a.click();a.remove();res(); }
    if(canvas.toBlob){
      try{ canvas.toBlob(b=>{ if(!b){viaURL();return;} const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);res(); },"image/png"); }
      catch(e){ viaURL(); }
    } else viaURL();
  });
}
async function exportPages(mode){
  if(!lastResult)return;
  if(typeof html2canvas==="undefined"){alert("저장 기능(html2canvas)을 불러오지 못했어요. 인터넷 연결을 확인하고, 채팅 미리보기가 아니라 실제 사이트 주소에서 다시 시도해 주세요.");return;}
  if(mode==="pdf" && (!window.jspdf || !window.jspdf.jsPDF)){alert("PDF 기능(jsPDF)을 불러오지 못했어요. 인터넷 연결을 확인하고 실제 사이트 주소에서 다시 시도해 주세요.");return;}
  overlay(true, mode==="pdf"?"PDF 만드는 중…":"이미지 만드는 중…");
  try{
    if(document.fonts&&document.fonts.ready){try{await document.fonts.ready;}catch(e){}}
    await wait(60);
    const host=document.getElementById("pages"); host.innerHTML="";
    const HDR='<div class="page-h"><span class="ph-l">기질 프로파일</span><span class="ph-r">TEMPERAMENT PROFILE</span></div>';
    const FTR='<div class="page-f"><span>기질 프로파일 결과 · 자기이해 리포트</span><span class="pn"></span></div>';
    function newPage(){const p=document.createElement("div");p.className="page";p.innerHTML=HDR+'<div class="page-c"></div>'+FTR;host.appendChild(p);return p.querySelector(".page-c");}
    const mk=h=>{const t=document.createElement("div");t.innerHTML=h;return t.firstElementChild;};
    const over=c=>c.scrollHeight>c.clientHeight+1;
    let cn=newPage();
    rptUnits().forEach(item=>{
      if(item.type==="single"){
        const n=mk(item.html); cn.appendChild(n);
        if(over(cn)&&cn.children.length>1){ cn.removeChild(n); cn=newPage(); cn.appendChild(n); }
      } else {
        const na=mk(item.a), nb=mk(item.b);
        cn.appendChild(na); cn.appendChild(nb);
        if(over(cn)){
          cn.removeChild(na); cn.removeChild(nb);
          if(cn.children.length>0){ cn=newPage(); }
          cn.appendChild(na); cn.appendChild(nb);
          if(over(cn)){ cn.removeChild(nb); cn=newPage(); cn.appendChild(nb); }
        }
      }
    });
    const pels=[...host.children], N=pels.length;
    pels.forEach((p,i)=>{const pn=p.querySelector(".pn");if(pn)pn.textContent=(i+1)+" / "+N;});
    await wait(80);
    let pdf=null; const imgs=[];
    for(let i=0;i<pels.length;i++){
      const c=await html2canvas(pels[i],{scale:2,backgroundColor:"#ffffff",width:794,height:1123,windowWidth:794});
      if(mode==="png"){ imgs.push(c.toDataURL("image/png")); }
      else{
        const J=window.jspdf.jsPDF; if(!pdf)pdf=new J("p","mm","a4"); if(i>0)pdf.addPage();
        const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
        let w=pw, h=c.height*pw/c.width; if(h>ph){ h=ph; w=c.width*ph/c.height; }
        pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",(pw-w)/2,0,w,h);
      }
    }
    if(mode==="pdf"&&pdf)pdf.save("기질프로파일.pdf");
    host.innerHTML="";
    overlay(false);
    if(mode==="png") showImageGallery(imgs);
    if(mode==="png")alert(N+"장의 이미지를 저장했어요. 휴대폰은 ‘다운로드’ 폴더(또는 사파리 주소창의 다운로드 아이콘)를 확인해 주세요.");
  }catch(e){ overlay(false); var hp=document.getElementById("pages"); if(hp)hp.innerHTML=""; alert("저장 중 문제가 생겼어요: "+((e&&e.message)?e.message:e)); }
}
function saveImage(){ exportPages("png"); }
function savePDF(){ exportPages("pdf"); }

intro();
</script>
